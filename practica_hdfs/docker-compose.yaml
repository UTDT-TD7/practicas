services:
   namenode:
      image: apache/hadoop:3
      hostname: namenode
      command: ["hdfs", "namenode"]
      ports:
        - 9870:9870
      env_file:
        - ./config
      environment:
          ENSURE_NAMENODE_DIR: "/tmp/hadoop-root/dfs/name"
      volumes:
        - ./input_data/:/shared_input/
        - ./output_data:/shared_output/
   datanode:
      image: apache/hadoop:3
      command: ["hdfs", "datanode"]
      deploy:
        mode: replicated
        replicas: 3
      env_file:
        - ./config      
      volumes:
        - ./input_data/:/shared_input/
        - ./output_data:/shared_output/
   resourcemanager:
      image: apache/hadoop:3
      hostname: resourcemanager
      command: ["yarn", "resourcemanager"]
      ports:
         - 8088:8088
      env_file:
        - ./config
      volumes:
        - ./test.sh:/opt/test.sh
        - ./input_data/:/shared_input/
        - ./output_data:/shared_output/
   nodemanager:
      image: apache/hadoop:3
      command: ["yarn", "nodemanager"]
      env_file:
        - ./config
      volumes:
        - ./input_data/:/shared_input/
        - ./output_data:/shared_output/
